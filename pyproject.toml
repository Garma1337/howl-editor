[project]
name = "howl-editor"
version = "0.7.0"
description = "GUI editor for Crash Team Racing HOWL (.HWL) audio files"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [ {name = "Garma"} ]
dependencies = [
    "PySide6>=6.5",
    "mido>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
howl-editor = "howl_editor.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["howl_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
