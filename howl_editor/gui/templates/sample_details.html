<h3>Sample — SPU {{ spu_index }}</h3>
<table class="kv">
    <tr>
        <td>SPU Index</td>
        <td>{{ spu_index }}</td>
    </tr>
    <tr>
        <td>Data size</td>
        <td>{{ data_size }}</td>
    </tr>
    <tr>

        <td>{{ bank_label }}</td>
